<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .box {
            background: white;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: left;
            gap: 20px;
        }

        button {
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        button:active {
            transform: scale(0.95);
        }

        #yes {
            background: #22c55e;
            color: white;
        }

        #yes:hover {
            background: #16a34a;
        }

        #no {
            background: #ef4444;
            color: white;
            position: fixed;
            left: 200px;
            top: 50%;
            z-index: 10;
        }

        #message {
            display: none;
            color: #22c55e;
            font-size: 24px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .box {
                width: 90%;
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            button {
                padding: 11px 24px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <h1 id="question">
            Do you like me? ❤️
        </h1>

        <div class="buttons">

            <button id="yes">
                YES
            </button>

            <button id="no">
                NO
            </button>

        </div>

        <div id="message">
            I knew you would say yes! ❤️😂
        </div>

    </div>

    <script>
        const noButton = document.getElementById("no");
        const yesButton = document.getElementById("yes");
        const question = document.getElementById("question");
        const buttons = document.querySelector(".buttons");
        const message = document.getElementById("message");

        function moveButton() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const padding = 10;

            const maxX = screenWidth - buttonWidth - padding;
            const maxY = screenHeight - buttonHeight - padding;

            const x = Math.random() * (maxX - padding) + padding;
            const y = Math.random() * (maxY - padding) + padding;

            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }

        noButton.addEventListener("mouseover", moveButton);

        noButton.addEventListener("touchstart", function (event) {
            event.preventDefault();
            moveButton();
        });

        yesButton.addEventListener("click", function () {
            buttons.style.display = "none";
            question.style.display = "none";
            message.style.display = "block";
            noButton.style.display = "none";
        });

        window.addEventListener("resize", function () {
            const rect = noButton.getBoundingClientRect();

            const maxX = window.innerWidth - noButton.offsetWidth - 10;
            const maxY = window.innerHeight - noButton.offsetHeight - 10;

            if (rect.left < 0) {
                noButton.style.left = "10px";
            }

            if (rect.left > maxX) {
                noButton.style.left = `${maxX}px`;
            }

            if (rect.top < 0) {
                noButton.style.top = "10px";
            }

            if (rect.top > maxY) {
                noButton.style.top = `${maxY}px`;
            }
        });
    </script>

</body>

</html>
