<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

            font-family: Arial, sans-serif;

            overflow: hidden;
        }

        .box {
            background: white;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

            position: relative;
            z-index: 2;
        }

        h1 {
            color: #222;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: left;
            gap: 20px;
        }

        button {
            border: none;
            padding: 12px 30px;

            font-size: 18px;

            border-radius: 10px;

            cursor: pointer;
        }

        #yes {
            background: #22c55e;
            color: white;
        }

        #no {
            background: #ef4444;
            color: white;

            /* Screen ke according move hoga */
            position: fixed;

            left: 200px;
            top: 50%;
        }

        #message {
            display: none;

            color: #22c55e;

            font-size: 24px;

            font-weight: bold;
        }
    </style>
</head>


<body>

    <div class="box">

        <h1>
            Do you like me? ❤️
        </h1>

        <div class="buttons">

            <button id="yes" onclick="yesClicked()">
                YES
            </button>

            <button id="no">
                NO
            </button>

        </div>

        <div id="message">
            I knew you would say yes! ❤️😂
        </div>

    </div>


    <script>

        const noButton = document.getElementById("no");


        function moveButton() {

            /*
             * Screen ki width aur height
             */
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;


            /*
             * NO button ki width aur height
             */
            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;


            /*
             * Button ko screen ke andar rakhne ke liye
             * 10px ka gap rakha hai.
             */
            const padding = 10;


            /*
             * Maximum X position
             */
            const maxX =
                screenWidth -
                buttonWidth -
                padding;


            /*
             * Maximum Y position
             */
            const maxY =
                screenHeight -
                buttonHeight -
                padding;


            /*
             * Random X position
             */
            const x =
                Math.random() *
                (maxX - padding) +
                padding;


            /*
             * Random Y position
             */
            const y =
                Math.random() *
                (maxY - padding) +
                padding;


            /*
             * Button ko new position dena
             */
            noButton.style.left = x + "px";
            noButton.style.top = y + "px";
        }


        /*
         * Mouse NO button ke paas jayega
         */
        noButton.addEventListener(
            "mouseover",
            moveButton
        );


        /*
         * Mobile ke liye
         */
        noButton.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveButton();

            }
        );


        /*
         * YES button
         */
        function yesClicked() {

            document.querySelector(".buttons").style.display =
                "none";

            document.querySelector("h1").style.display =
                "none";

            document.getElementById("message").style.display =
                "block";
        }


        /*
         * Window resize hone par
         * button ko screen ke andar rakho
         */
        window.addEventListener(
            "resize",
            function () {

                const rect =
                    noButton.getBoundingClientRect();

                const maxX =
                    window.innerWidth -
                    noButton.offsetWidth -
                    10;

                const maxY =
                    window.innerHeight -
                    noButton.offsetHeight -
                    10;


                if (rect.left > maxX) {
                    noButton.style.left =
                        maxX + "px";
                }


                if (rect.top > maxY) {
                    noButton.style.top =
                        maxY + "px";
                }

            }
        );

    </script>

</body>

</html>
